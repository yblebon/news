<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script defer src="https://umami-livid-five.vercel.app/script.js" data-website-id="23ec60ec-27e5-4215-8750-cbcc726903d7"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #1a1a2e;
            --ink-muted: #4a4a6a;
            --ink-faint: #8888aa;
            --accent: #c0392b;
            --accent-hover: #a93226;
            --surface: #fafaf8;
            --card: #ffffff;
            --border: #e4e4f0;
            --tag-active-bg: #1a1a2e;
            --tag-active-fg: #fafaf8;
            --shadow: 0 2px 12px rgba(26,26,46,0.08);
            --shadow-hover: 0 6px 24px rgba(26,26,46,0.14);
            --radius: 10px;
            --font-head: 'Playfair Display', Georgia, serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            padding: 0 0 60px;
        }

        header {
            background: var(--ink);
            color: #fff;
            padding: 28px 24px 24px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }
        header h1 {
            font-family: var(--font-head);
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            letter-spacing: -0.5px;
            color: #fff;
        }
        header p.subtitle {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .controls-bar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(26,26,46,0.06);
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ink-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        select, input[type="text"] {
            font-family: var(--font-body);
            font-size: 0.9rem;
            padding: 7px 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--ink);
            outline: none;
            transition: border-color 0.15s;
        }
        select:focus, input[type="text"]:focus {
            border-color: var(--ink);
        }
        button[type="button"] {
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 600;
            padding: 7px 14px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        button[type="button"]:hover:not(:disabled) {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }
        button[type="button"]:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        #refresh-btn {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        #refresh-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .tags-bar {
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .tag {
            font-size: 0.83rem;
            font-weight: 500;
            padding: 6px 13px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            background: var(--card);
            color: var(--ink-muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        .tag:hover:not(.active) {
            border-color: var(--ink);
            color: var(--ink);
        }
        .tag.active {
            background: var(--tag-active-bg);
            color: var(--tag-active-fg);
            border-color: var(--tag-active-bg);
        }
        .tag.sensitive { border-color: #e07b54; color: #c0522a; }
        .tag.sensitive.active { background: #c0522a; border-color: #c0522a; color: #fff; }

        .sort-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 24px 12px;
            flex-wrap: wrap;
        }
        #sort-btn.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }
        .result-count {
            font-size: 0.8rem;
            color: var(--ink-faint);
            margin-left: auto;
        }

        #news {
            max-width: 860px;
            margin: 0 auto;
            padding: 8px 24px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .news-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            transition: transform 0.18s, box-shadow 0.18s;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 4px 16px;
            align-items: start;
        }
        .news-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .news-item-body { grid-column: 1; }
        .news-item-meta {
            grid-column: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .news-source {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .news-date {
            font-size: 0.75rem;
            color: var(--ink-faint);
        }
        .news-dot { color: var(--border); font-size: 0.6rem; }
        .news-title {
            font-family: var(--font-head);
            font-size: 1.12rem;
            line-height: 1.4;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .news-desc {
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--ink-muted);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1.5px solid var(--border);
            transition: color 0.15s, border-color 0.15s;
        }
        .news-link:hover { color: var(--accent); border-color: var(--accent); }
        .news-link-arrow { font-size: 0.75rem; transition: transform 0.15s; }
        .news-link:hover .news-link-arrow { transform: translateX(3px); }

        .status-msg {
            text-align: center;
            padding: 48px 24px;
            color: var(--ink-muted);
            font-size: 1rem;
        }
        .status-msg.error { color: var(--accent); }
        .status-msg .icon { font-size: 2rem; display: block; margin-bottom: 10px; }

        .skeleton {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
        }
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, #eee 25%, #f8f8f8 50%, #eee 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-bottom: 10px;
        }
        .skeleton-line.wide { width: 90%; }
        .skeleton-line.med  { width: 60%; }
        .skeleton-line.short{ width: 35%; height: 10px; }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26,26,46,0.55);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--card);
            padding: 28px 28px 22px;
            border-radius: 14px;
            max-width: 380px;
            width: calc(100% - 40px);
            text-align: center;
            box-shadow: 0 20px 60px rgba(26,26,46,0.25);
        }
        .modal-icon { font-size: 2rem; margin-bottom: 12px; }
        .modal-content h3 {
            font-family: var(--font-head);
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--ink);
        }
        .modal-content p {
            font-size: 0.9rem;
            color: var(--ink-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-accept, .btn-cancel {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-accept { background: var(--ink); color: #fff; }
        .btn-accept:hover { opacity: 0.85; }
        .btn-cancel { background: var(--border); color: var(--ink); }
        .btn-cancel:hover { opacity: 0.75; }

        @media (max-width: 600px) {
            .controls-bar { padding: 12px 16px; }
            #news { padding: 8px 16px 0; }
            .tags-bar, .sort-row { padding-left: 16px; padding-right: 16px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Latest News</h1>
    <p class="subtitle" id="header-subtitle">Powered by Google News RSS</p>
</header>

<div class="controls-bar">
    <div class="controls-group">
        <label for="source-select">Source</label>
        <select id="source-select">
            <option value="google" selected>Google News</option>
            <option value="bbc">BBC News</option>
            <option value="guardian">The Guardian</option>
        </select>
    </div>
    <div class="controls-group" id="language-group">
        <label for="language-select">Language</label>
        <select id="language-select">
            <option value="en|US" selected>English (US)</option>
            <option value="fr|FR">French</option>
            <option value="es|ES">Spanish</option>
            <option value="de|DE">German</option>
            <option value="it|IT">Italian</option>
        </select>
    </div>
    <div class="controls-group" id="location-group">
        <label for="location-search">Location</label>
        <input type="text" id="location-search" placeholder="e.g. New York" autocomplete="off">
    </div>
    <div class="controls-group">
        <label for="news-count">Show</label>
        <select id="news-count">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
        </select>
    </div>
    <button type="button" id="refresh-btn">↻ Refresh</button>
</div>

<div class="tags-bar">
    <button type="button" class="tag active" data-topic="all">All</button>
    <button type="button" class="tag" data-topic="technology">Technology</button>
    <button type="button" class="tag" data-topic="sports">Sports</button>
    <button type="button" class="tag" data-topic="business">Business</button>
    <button type="button" class="tag" data-topic="entertainment">Entertainment</button>
    <button type="button" class="tag" data-topic="world">World</button>
    <button type="button" class="tag sensitive" data-topic="death">Death</button>
    <button type="button" class="tag sensitive" data-topic="accident">Accident</button>
</div>

<div class="sort-row">
    <button type="button" id="sort-btn" class="active">↓ Newest First</button>
    <span class="result-count" id="result-count"></span>
</div>

<div id="news"></div>

<div id="content-warning" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
        <div class="modal-icon">⚠️</div>
        <h3 id="modal-title">Sensitive Content</h3>
        <p>News about "<strong id="warning-topic"></strong>" may contain distressing or upsetting content. Do you want to continue?</p>
        <div class="modal-actions">
            <button type="button" class="btn-accept" id="accept-warning">Continue</button>
            <button type="button" class="btn-cancel" id="cancel-btn">Cancel</button>
        </div>
    </div>
</div>

<script>
    // ── News source definitions ────────────────────────────────────
    const SOURCES = {
        google: {
            label: 'Powered by Google News RSS',
            supportsLanguage: true,
            supportsLocation: true,
            supportsTopics: true,
            buildUrl(topic, location, language, region) {
                const base = 'https://news.google.com/rss';
                let query = topic === 'all' ? '' : topic;
                if (location) query = query ? `${query} in ${location}` : `in ${location}`;
                return query
                    ? `${base}/search?q=${encodeURIComponent(query)}&hl=${encodeURIComponent(language)}&gl=${encodeURIComponent(region)}`
                    : `${base}?hl=${encodeURIComponent(language)}&gl=${encodeURIComponent(region)}`;
            }
        },
        bbc: {
            label: 'Powered by BBC News RSS',
            supportsLanguage: false,
            supportsLocation: false,
            supportsTopics: true,
            // BBC has per-section feeds; search topics map to known feeds
            topicFeeds: {
                all:           'https://feeds.bbci.co.uk/news/rss.xml',
                technology:    'https://feeds.bbci.co.uk/news/technology/rss.xml',
                sports:        'https://feeds.bbci.co.uk/sport/rss.xml',
                business:      'https://feeds.bbci.co.uk/news/business/rss.xml',
                entertainment: 'https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml',
                world:         'https://feeds.bbci.co.uk/news/world/rss.xml',
                death:         'https://feeds.bbci.co.uk/news/rss.xml',
                accident:      'https://feeds.bbci.co.uk/news/rss.xml',
            },
            buildUrl(topic) {
                return this.topicFeeds[topic] || this.topicFeeds.all;
            }
        },
        guardian: {
            label: 'Powered by The Guardian RSS',
            supportsLanguage: false,
            supportsLocation: false,
            supportsTopics: true,
            topicFeeds: {
                all:           'https://www.theguardian.com/world/rss',
                technology:    'https://www.theguardian.com/technology/rss',
                sports:        'https://www.theguardian.com/sport/rss',
                business:      'https://www.theguardian.com/business/rss',
                entertainment: 'https://www.theguardian.com/culture/rss',
                world:         'https://www.theguardian.com/world/rss',
                death:         'https://www.theguardian.com/world/rss',
                accident:      'https://www.theguardian.com/world/rss',
            },
            buildUrl(topic) {
                return this.topicFeeds[topic] || this.topicFeeds.all;
            }
        }
    };

    const shownWarnings = {
        death:    sessionStorage.getItem('warning-death')    === 'true',
        accident: sessionStorage.getItem('warning-accident') === 'true'
    };

    let isSortDescending = true;

    // ── CORS proxies to try in order ───────────────────────────────
    // allorigins wraps JSON; use /raw?url= to get the raw RSS text directly
    const PROXIES = [
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    ];

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function stripTags(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || '').trim();
    }

    /** Try each proxy in turn; resolve with the first successful text response.
     *  If directFirst=true, attempt the raw URL first (for CORS-open sources). */
    async function fetchRSS(rssUrl, directFirst = false) {
        let lastError;
        const attempts = directFirst
            ? [url => url, ...PROXIES]
            : PROXIES;
        for (const makeProxy of attempts) {
            const proxyUrl = makeProxy(rssUrl);
            try {
                const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                if (!text.trim().startsWith('<')) throw new Error('Response is not XML');
                return text;
            } catch (err) {
                console.warn(`Attempt failed (${proxyUrl}):`, err.message);
                lastError = err;
            }
        }
        throw lastError || new Error('All fetch attempts failed');
    }

    function showSkeleton(count = 5) {
        const container = document.getElementById('news');
        container.innerHTML = Array.from({ length: count }, () => `
            <div class="skeleton">
                <div class="skeleton-line short"></div>
                <div class="skeleton-line wide" style="height:16px; margin-bottom:12px;"></div>
                <div class="skeleton-line med"></div>
            </div>
        `).join('');
    }

    async function fetchNews() {
        const newsContainer  = document.getElementById('news');
        const resultCount    = document.getElementById('result-count');
        const newsCount      = parseInt(document.getElementById('news-count').value);
        const refreshBtn     = document.getElementById('refresh-btn');
        const sortBtn        = document.getElementById('sort-btn');
        const languageSelect = document.getElementById('language-select');
        const newsCountSel   = document.getElementById('news-count');
        const sourceSelect   = document.getElementById('source-select');
        const topic          = document.querySelector('.tag.active').dataset.topic;
        const location       = document.getElementById('location-search').value.trim();
        const [language, region] = languageSelect.value.split('|');
        const sourceKey      = sourceSelect.value;
        const source         = SOURCES[sourceKey];

        // Update header subtitle
        document.getElementById('header-subtitle').textContent = source.label;

        // Show/hide language & location controls based on source capabilities
        document.getElementById('language-group').style.display  = source.supportsLanguage  ? '' : 'none';
        document.getElementById('location-group').style.display  = source.supportsLocation  ? '' : 'none';

        let requestDetails = { sourceKey, topic, location, newsCount, language, region };

        [refreshBtn, sortBtn, languageSelect, newsCountSel, sourceSelect].forEach(el => el.disabled = true);
        resultCount.textContent = '';
        showSkeleton(3);

        try {
            const rssUrl = source.buildUrl(topic, location, language, region);
            // BBC is CORS-open; try direct first. Google & Guardian need proxies.
            const directFirst = sourceKey === 'bbc';

            requestDetails.url = rssUrl;
            console.log('Fetching news:', requestDetails);

            const text = await fetchRSS(rssUrl, directFirst);

            const parser = new DOMParser();
            const xml    = parser.parseFromString(text, 'text/xml');
            if (xml.querySelector('parsererror')) throw new Error('RSS feed parse error');

            const items = Array.from(xml.querySelectorAll('item'));

            items.sort((a, b) => {
                const dateA = new Date(a.querySelector('pubDate')?.textContent || 0);
                const dateB = new Date(b.querySelector('pubDate')?.textContent || 0);
                return isSortDescending ? dateB - dateA : dateA - dateB;
            });

            newsContainer.innerHTML = '';
            const visible = items.slice(0, newsCount);

            if (items.length > 0) {
                resultCount.textContent = `Showing ${visible.length} of ${items.length} articles`;
            }

            visible.forEach((item, i) => {
                const rawTitle = item.querySelector('title')?.textContent       || 'No title';
                const link     = item.querySelector('link')?.textContent        || '#';
                const pubDate  = item.querySelector('pubDate')?.textContent     || '';
                const rawSrc   = item.querySelector('source')?.textContent      || 'Unknown Source';
                const rawDesc  = item.querySelector('description')?.textContent || '';
                const desc     = stripTags(rawDesc);

                const date = pubDate ? new Date(pubDate).toLocaleString(undefined, {
                    month: 'short', day: 'numeric', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                }) : 'Unknown date';

                const title    = escapeHtml(rawTitle);
                const source   = escapeHtml(rawSrc);
                const safeDesc = escapeHtml(desc);

                const card = document.createElement('article');
                card.className = 'news-item';
                card.style.animationDelay = `${i * 40}ms`;
                card.innerHTML = `
                    <div class="news-item-body">
                        <div class="news-item-meta">
                            <span class="news-source">${source}</span>
                            <span class="news-dot">●</span>
                            <span class="news-date">${date}</span>
                        </div>
                        <h2 class="news-title">${title}</h2>
                        ${safeDesc ? `<p class="news-desc">${safeDesc}</p>` : ''}
                        <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="news-link">
                            Read article <span class="news-link-arrow">→</span>
                        </a>
                    </div>
                `;
                newsContainer.appendChild(card);
            });

            if (items.length === 0) {
                newsContainer.innerHTML = `
                    <div class="status-msg">
                        <span class="icon">🔍</span>
                        No articles found for <strong>${escapeHtml(topic)}</strong>${location ? ` in <strong>${escapeHtml(location)}</strong>` : ''}.
                    </div>`;
            }

        } catch (err) {
            console.error('Fetch failed:', { error: err.message, ...requestDetails });

            let msg = 'Failed to load news. All proxy attempts failed — please try again later.';
            if (err.message.includes('HTTP'))       msg = `Server error: ${err.message}. Try refreshing.`;
            else if (err.message.includes('parse')) msg = 'Could not parse the news feed. It may be temporarily unavailable.';
            else if (err.name === 'TypeError')      msg = 'Network error: check your internet connection.';

            newsContainer.innerHTML = `<div class="status-msg error"><span class="icon">⚠️</span>${escapeHtml(msg)}</div>`;
            resultCount.textContent = '';
        } finally {
            [refreshBtn, sortBtn, languageSelect, newsCountSel, sourceSelect].forEach(el => el.disabled = false);
        }
    }

    function showContentWarning(topic, onAccept) {
        if (shownWarnings[topic]) { onAccept(); return; }

        const modal     = document.getElementById('content-warning');
        const topicSpan = document.getElementById('warning-topic');
        const acceptBtn = document.getElementById('accept-warning');
        const cancelBtn = document.getElementById('cancel-btn');

        topicSpan.textContent = topic.charAt(0).toUpperCase() + topic.slice(1);
        modal.style.display = 'flex';

        function cleanup() {
            modal.style.display = 'none';
            acceptBtn.removeEventListener('click', handleAccept);
            cancelBtn.removeEventListener('click', handleCancel);
        }
        function handleAccept() {
            shownWarnings[topic] = true;
            sessionStorage.setItem(`warning-${topic}`, 'true');
            cleanup();
            onAccept();
        }
        function handleCancel() {
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
            document.querySelector('.tag[data-topic="all"]').classList.add('active');
            cleanup();
            fetchNews();
        }

        acceptBtn.addEventListener('click', handleAccept);
        cancelBtn.addEventListener('click', handleCancel);
    }

    document.querySelectorAll('.tag').forEach(tag => {
        tag.addEventListener('click', () => {
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
            const t = tag.dataset.topic;
            (t === 'death' || t === 'accident') ? showContentWarning(t, fetchNews) : fetchNews();
        });
    });

    document.getElementById('refresh-btn').addEventListener('click', () => {
        const t = document.querySelector('.tag.active').dataset.topic;
        (t === 'death' || t === 'accident') ? showContentWarning(t, fetchNews) : fetchNews();
    });

    document.getElementById('source-select').addEventListener('change', fetchNews);
    document.getElementById('news-count').addEventListener('change', fetchNews);
    document.getElementById('language-select').addEventListener('change', fetchNews);

    document.getElementById('location-search').addEventListener('input', function () {
        clearTimeout(window.searchTimeout);
        const val = this.value.trim();
        if (val === '' || val.length >= 3) {
            window.searchTimeout = setTimeout(fetchNews, 600);
        }
    });

    document.getElementById('sort-btn').addEventListener('click', () => {
        isSortDescending = !isSortDescending;
        const btn = document.getElementById('sort-btn');
        btn.textContent = isSortDescending ? '↓ Newest First' : '↑ Oldest First';
        btn.classList.toggle('active', isSortDescending);
        fetchNews();
    });

    fetchNews();
</script>
</body>
</html>
